<!DOCTYPE html>
<html>
<body>
<script>
// The Export URL converts the Google Doc into raw text
const GOOGLE_DOC_URL = "https://docs.google.com/document/d/1REOSOiBGQeHBO7K_p5Owo4qonGQAK8da17lJp7J_LmQ/export?format=txt";

function getRandomImage(category, count) {
  const num = Math.floor(Math.random() * count) + 1;
  return `images/${category}/${num}.png`;
}

async function downloadImage(url) {
  try {
    const response = await fetch(url);
    if (!response.ok) throw new Error("Failed to fetch image");

    const blob = await response.blob();
    const blobUrl = window.URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = blobUrl;

    // Extract filename (e.g. 3.png)
    link.download = url.split("/").pop() || "image.png";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    window.URL.revokeObjectURL(blobUrl);
  } catch (err) {
    console.error("Download error:", err);
  }
}

async function run() {
  try {
    const params = new URLSearchParams(window.location.search);
    const msg = (params.get("message") || "").toLowerCase();

    // 1. Fetch from Google Docs
    const res = await fetch(GOOGLE_DOC_URL);
    if (!res.ok) throw new Error("Failed to fetch from Google Docs");

    // 2. Parse JSON
    const text = await res.text();
    const data = JSON.parse(text);

    let result = "images/default.jpg";

    // 3. Match keyword
    for (const [category, value] of Object.entries(data)) {
      if (value.keywords.some(word => msg.includes(word.toLowerCase()))) {
        result = getRandomImage(category, value.count);
        break;
      }
    }

    // 4. Convert relative path → full URL (IMPORTANT)
    const fullUrl = `https://gamdmc.github.io/MM/imageapi/${result}`;

    // 5. Download instead of redirect
    await downloadImage(fullUrl);

  } catch (error) {
    console.error("Error:", error);
  }
}

run();
</script>
</body>
</html>
