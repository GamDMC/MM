<!DOCTYPE html>
<html>
<body>
<script>
function getRandomImage(category, count) {
  const num = Math.floor(Math.random() * count) + 1;
  return `images/${category}/${num}.png`;
}

async function run() {
  const params = new URLSearchParams(window.location.search);
  const msg = (params.get("message") || "").toLowerCase();

  const res = await fetch("data.json");
  const data = await res.json();

  let result = "default.jpg";

  for (const [category, value] of Object.entries(data)) {
    if (value.keywords.some(word => msg.includes(word))) {
      result = getRandomImage(category, value.count);
      break;
    }
  }

  // document.body.innerText = JSON.stringify({ image: result });
// 👇 redirect to image directly
window.location.href = result;
}

run();
</script>
</body>
</html>
